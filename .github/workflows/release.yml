name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    # The release script pushes main + tag atomically; only the tag run publishes.
    if: ${{ github.ref_type == 'tag' || github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release v') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@52b80fdb2795ea4948978d5a60f661bdd6fb2bf9 # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: |
            src-tauri -> target
            tools/verify-release -> target
      - name: Check synchronized versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node scripts/release-artifacts.mjs check-version "$GITHUB_REF_NAME"
          else
            node scripts/release-artifacts.mjs check-version
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:release
      - run: pnpm run test:dev
      - run: pnpm run test:i18n
      - run: pnpm run build
      - run: pnpm exec playwright install chromium
      - run: pnpm run test:ui
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path tools/verify-release/Cargo.toml
      - name: Upload failed browser checks
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-ui-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
          - name: macOS Apple Silicon
            os: macos-latest
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS Intel
            os: macos-latest
            platform: darwin-x86_64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@52b80fdb2795ea4948978d5a60f661bdd6fb2bf9 # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo '::error::Set TAURI_SIGNING_PRIVATE_KEY before releasing.'; exit 1; }
            pnpm run tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            pnpm run tauri build ${{ matrix.args }}
          fi
      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./scripts/package-portable.ps1 -Sign:($env:GITHUB_REF_TYPE -eq 'tag')
      - name: Collect platform artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node scripts/release-artifacts.mjs collect "$PLATFORM" --signed
          else
            node scripts/release-artifacts.mjs collect "$PLATFORM"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: dist-release/${{ matrix.platform }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Verify and publish GitHub release
    needs: bundle
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@52b80fdb2795ea4948978d5a60f661bdd6fb2bf9 # v3.1.2
        with:
          runtime: node@24
          install: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: tools/verify-release -> target
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Generate update manifest and checksums
        run: node scripts/release-artifacts.mjs manifest release-assets "$GITHUB_REF_NAME"
      - name: Verify every updater signature and signed version
        run: cargo run --locked --manifest-path tools/verify-release/Cargo.toml -- src-tauri/tauri.conf.json release-assets/latest.json release-assets "$GITHUB_REF_NAME"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo '::error::This release is already public; create a new version.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "inZOI Better Mod Manager $GITHUB_REF_NAME" --notes-file .github/release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
